<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3D9FF">
<title>Festie 프로토타입</title>
<meta name="description" content="페스티벌 준비부터 기억까지 한곳에 담는 아카이브 앱 Festie의 인터랙티브 프로토타입">
<link rel="icon" href="icons/favicon.svg?v=8" type="image/svg+xml">
<link rel="icon" href="icons/icon-32.png?v=8" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png?v=8">
<link rel="apple-touch-icon-precomposed" sizes="180x180" href="icons/icon-180.png?v=8">
<link rel="manifest" href="manifest.webmanifest?v=8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Festie">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@600;700&amp;family=Hanken+Grotesk:wght@400;500;600&amp;family=Noto+Sans+KR:wght@400;500;700&amp;display=swap">
<style>
  :root { --ink: #0A0A0A; --lav: #F3D9FF; --glow: #FFF7B8; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--ink);
    color: var(--lav);
    font-family: 'Hanken Grotesk', 'Noto Sans KR', sans-serif;
    display: flex; align-items: center; justify-content: center; gap: 48px;
    min-height: 100vh; padding: 24px; overflow: hidden;
  }
  .stage { flex-shrink: 0; }
  .phone {
    width: 390px; height: 844px; border-radius: 40px; overflow: hidden;
    transform-origin: top left; background: var(--lav);
    box-shadow: 0 0 0 10px #1c1c1c, 0 24px 60px rgba(0,0,0,0.6);
  }
  @keyframes festie-rise{from{transform:translateY(28px);opacity:0}to{transform:none;opacity:1}}
  @keyframes festie-push{from{transform:translateY(-130%)}to{transform:none}}
  @keyframes festie-kb{from{transform:translateY(100%)}to{transform:none}}
  /* 시작 화면 시안 애니메이션 (컨페티 흩날림 · 웨이브 · LED 반짝임) */
  .fcf{transform-box:fill-box;transform-origin:center}
  @keyframes fcf-a{0%{transform:translate(0,-14px) rotate(-18deg);opacity:0}15%{opacity:1}50%{transform:translate(8px,6px) rotate(16deg)}85%{opacity:1}100%{transform:translate(-4px,26px) rotate(-8deg);opacity:0}}
  @keyframes fcf-b{0%{transform:translate(0,-14px) rotate(14deg);opacity:0}15%{opacity:1}50%{transform:translate(-8px,6px) rotate(-20deg)}85%{opacity:1}100%{transform:translate(5px,26px) rotate(10deg);opacity:0}}
  .fcf1{animation:fcf-a 3.8s ease-in-out infinite}.fcf2{animation:fcf-b 4.4s ease-in-out infinite}.fcf3{animation:fcf-a 5.0s ease-in-out infinite}.fcf4{animation:fcf-b 5.6s ease-in-out infinite}.fcf5{animation:fcf-a 6.2s ease-in-out infinite}.fcf6{animation:fcf-b 4.8s ease-in-out infinite}
  @media (prefers-reduced-motion: reduce){.fcf{animation:none !important}}
  
  
  @keyframes fwv{from{transform:translateX(0)}to{transform:translateX(-288px)}}
  .fwv{animation:fwv 9s linear infinite}
  .fws{transform-box:fill-box;transform-origin:center;animation:fws 2.4s ease-in-out infinite}
  @keyframes fws{0%,100%{transform:scale(.55)}50%{transform:scale(1.3)}}
  @media (prefers-reduced-motion: reduce){.fwv,.fws{animation:none !important}}
  
  
  @keyframes tw{0%,100%{opacity:1}50%{opacity:.35}}
  @keyframes bl{0%,100%{opacity:0}40%,60%{opacity:1}}
  @keyframes pulse{0%,100%{opacity:.75}50%{opacity:1}}
  .tw1{animation:tw 1.6s ease-in-out infinite}.tw2{animation:tw 2.3s ease-in-out infinite}.tw3{animation:tw 3.1s ease-in-out infinite}.tw4{animation:none}
  .bl{animation:bl 2.4s ease-in-out infinite}
  .pulse{animation:pulse 2.8s ease-in-out infinite}
  @media (prefers-reduced-motion: reduce){.tw,.bl,.pulse{animation:none !important}}
  
  
  .panel { width: 260px; display: flex; flex-direction: column; gap: 18px; }
  .panel h1 { margin: 0; font-family: 'Josefin Sans', sans-serif; font-weight: 700; font-size: 44px; letter-spacing: -0.02em; line-height: 0.9; }
  .panel p { margin: 0; font-family: 'Noto Sans KR', sans-serif; font-size: 14px; line-height: 1.6; color: rgba(243,217,255,0.78); }
  .panel label { font-family: 'Noto Sans KR', sans-serif; font-weight: 700; font-size: 13px; }
  .panel select, .panel button {
    width: 100%; min-height: 44px; border: 1.5px solid var(--lav); background: transparent; color: var(--lav);
    font-family: 'Noto Sans KR', sans-serif; font-size: 14px; padding: 0 12px; cursor: pointer;
  }
  .panel select option { color: var(--ink); }
  .panel button { background: var(--lav); color: var(--ink); font-weight: 700; }
  .field { display: flex; flex-direction: column; gap: 8px; }
  #topfill { display: none; position: fixed; top: 0; left: 0; right: 0; height: 0; overflow: hidden; pointer-events: none; z-index: 5; }
  #topfill img { position: absolute; top: 0; left: 0; display: none; }
  #sat-probe { position: fixed; top: 0; left: 0; width: 0; height: env(safe-area-inset-top); visibility: hidden; pointer-events: none; }
  /* 휴대폰으로 볼 때: 화면 속 가짜 상태바(9:41 · 배터리)는 숨기고, 실제 휴대폰 상태바 아래로 앱이 화면 높이에 꽉 차게 */
  @media (max-width: 760px) {
    html, body { height: 100%; overflow: hidden; }
    body { min-height: 0; padding: env(safe-area-inset-top) 0 0; gap: 0; align-items: flex-start; justify-content: flex-start; background: var(--lav); }
    .panel { display: none; }
    .phone { border-radius: 0; box-shadow: none; height: var(--app-h, 844px); }
    #app .sb { display: none !important; }
    /* 실제 상태바 높이(--sat)만큼 패턴을 위로 올려서, 상태바 영역(#topfill)의 패턴과 끊김 없이 이어지게 */
    #app .pat-sb { top: calc(0px - var(--sat, 0px)) !important; }
    #app .pat-full { top: calc(0px - var(--sat, 0px)) !important; height: calc(100% + var(--sat, 0px)) !important; }
    #topfill { display: block; }
    #app > div, #app [id^="screen-"] { height: var(--app-h, 844px) !important; }
  }
</style>
</head>
<body>
<div id="topfill" aria-hidden="true"><img alt=""></div>
<div id="sat-probe" aria-hidden="true"></div>
<div class="stage" id="stage"><div class="phone" id="phone"><div id="app"></div></div></div>

  </div>
  <button type="button" id="restart">처음부터 다시 하기</button>

<script>
(function () {
  var params = new URLSearchParams(location.search);
  var start = params.get('start') || 'splash';
  var select = document.getElementById('start');
  if (select.querySelector('option[value="' + start + '"]')) select.value = start;

  dcLite.mount({
    template: document.getElementById('festie-screens'),
    component: window.FestieApp,
    target: document.getElementById('app'),
    props: { start: start }
  });

  function go(s) {
    var url = new URL(location.href);
    if (s === 'splash') url.searchParams.delete('start'); else url.searchParams.set('start', s);
    location.href = url.toString();
  }
  select.addEventListener('change', function () { go(select.value); });
  document.getElementById('restart').addEventListener('click', function () { go('splash'); });

  // 화면 크기에 맞춰 390×844 폰 화면을 줄여서 보여줘요
  var stage = document.getElementById('stage');
  var phone = document.getElementById('phone');
  var root = document.documentElement;
  var themeMeta = document.querySelector('meta[name="theme-color"]');
  var topfill = document.getElementById('topfill');
  var topImg = topfill.querySelector('img');
  var probe = document.getElementById('sat-probe');
  // 실제 상태바(안전 영역) 높이. ?sat=47 로 시뮬레이션 가능
  function satPx() {
    var forced = parseFloat(params.get('sat'));
    if (!isNaN(forced)) return forced;
    return probe.getBoundingClientRect().height || 0;
  }
  function fit() {
    var narrow = window.innerWidth <= 760;
    if (narrow) {
      // 휴대폰: 폭에 맞춰 키우고, 남은 세로 길이만큼 앱 높이를 늘려요
      var s = window.innerWidth / 390;
      var top = satPx();
      document.body.style.paddingTop = top + 'px';
      root.style.setProperty('--sat', (top / s) + 'px');
      topfill.style.height = top + 'px';
      topImg.style.width = (390 * s) + 'px';
      var vh = (window.visualViewport ? window.visualViewport.height : window.innerHeight) - top;
      root.style.setProperty('--app-h', (vh / s) + 'px');
      phone.style.transform = 'scale(' + s + ')';
      stage.style.width = window.innerWidth + 'px';
      stage.style.height = vh + 'px';
    } else {
      var d = Math.max(0.4, Math.min(1, (window.innerHeight - 48) / 844, (window.innerWidth - 360) / 390));
      root.style.removeProperty('--app-h');
      root.style.removeProperty('--sat');
      document.body.style.paddingTop = '';
      phone.style.transform = 'scale(' + d + ')';
      stage.style.width = (390 * d) + 'px';
      stage.style.height = (844 * d) + 'px';
    }
  }
  // 휴대폰 상단(실제 상태바 뒤) 색을 지금 화면 배경색과 맞춰요
  var lastBg = '';
  function syncBg() {
    if (window.innerWidth > 760) { document.body.style.background = ''; return; }
    var el = document.querySelector('#app [id^="screen-"]');
    if (!el) return;
    var c = getComputedStyle(el).backgroundColor;
    // 화면 맨 위 패턴(전체 배경 또는 타이틀 뒤 패턴)이 있으면 상태바 영역에도 같은 패턴을 깔아요
    var pat = el.querySelector('img.pat-full') || el.querySelector('main img.pat-sb');
    var src = pat ? pat.getAttribute('src') : '';
    var op = pat ? getComputedStyle(pat).opacity : '1';
    var mk = pat ? (pat.style.webkitMaskImage || pat.style.maskImage || '') : '';
    var key = c + '|' + src + '|' + op;
    if (key === lastBg) return;
    lastBg = key;
    document.body.style.background = c;
    topfill.style.background = c;
    if (src) {
      topImg.src = src; topImg.style.opacity = op; topImg.style.display = 'block';
      topImg.style.height = (844 * (window.innerWidth / 390)) + 'px';
      topImg.style.objectFit = 'cover'; topImg.style.objectPosition = 'center top';
    } else {
      topImg.removeAttribute('src'); topImg.style.display = 'none';
    }
    if (themeMeta) themeMeta.setAttribute('content', c);
  }
  new MutationObserver(syncBg).observe(document.getElementById('app'), { childList: true, subtree: true, attributes: true, attributeFilter: ['src', 'id'] });
  window.addEventListener('resize', function () { fit(); lastBg = ''; syncBg(); });
  if (window.visualViewport) window.visualViewport.addEventListener('resize', fit);
  fit();
  syncBg();
})();
</script>
