<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3D9FF">
<title>Festie 프로토타입</title>
<meta name="description" content="페스티벌 준비부터 기억까지 한곳에 담는 아카이브 앱 Festie의 인터랙티브 프로토타입">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Festie">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@600;700&amp;family=Hanken+Grotesk:wght@400;500;600&amp;family=Noto+Sans+KR:wght@400;500;700&amp;display=swap">
<style>
  :root { --ink: #0A0A0A; --lav: #F3D9FF; --glow: #FFFACD; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--ink);
    color: var(--lav);
    font-family: 'Hanken Grotesk', 'Noto Sans KR', sans-serif;
    display: flex; align-items: center; justify-content: center; gap: 48px;
    min-height: 100vh; padding: 24px; overflow: hidden;
  }
  .stage { flex-shrink: 0; }
  .phone {
    width: 390px; height: 844px; border-radius: 40px; overflow: hidden;
    transform-origin: top left; background: var(--lav);
    box-shadow: 0 0 0 10px #1c1c1c, 0 24px 60px rgba(0,0,0,0.6);
  }
  @keyframes festie-rise{from{transform:translateY(28px);opacity:0}to{transform:none;opacity:1}}
  @keyframes festie-push{from{transform:translateY(-130%)}to{transform:none}}
  @keyframes festie-kb{from{transform:translateY(100%)}to{transform:none}}
  .panel { width: 260px; display: flex; flex-direction: column; gap: 18px; }
  .panel h1 { margin: 0; font-family: 'Josefin Sans', sans-serif; font-weight: 700; font-size: 44px; letter-spacing: -0.02em; line-height: 0.9; }
  .panel p { margin: 0; font-family: 'Noto Sans KR', sans-serif; font-size: 14px; line-height: 1.6; color: rgba(243,217,255,0.78); }
  .panel label { font-family: 'Noto Sans KR', sans-serif; font-weight: 700; font-size: 13px; }
  .panel select, .panel button {
    width: 100%; min-height: 44px; border: 1.5px solid var(--lav); background: transparent; color: var(--lav);
    font-family: 'Noto Sans KR', sans-serif; font-size: 14px; padding: 0 12px; cursor: pointer;
  }
  .panel select option { color: var(--ink); }
  .panel button { background: var(--lav); color: var(--ink); font-weight: 700; }
  .field { display: flex; flex-direction: column; gap: 8px; }
  /* 휴대폰으로 볼 때: 화면 속 가짜 상태바(9:41 · 배터리)는 숨기고, 실제 휴대폰 상태바 아래로 앱이 화면 높이에 꽉 차게 */
  @media (max-width: 760px) {
    html, body { height: 100%; overflow: hidden; }
    body { min-height: 0; padding: env(safe-area-inset-top) 0 0; gap: 0; align-items: flex-start; justify-content: flex-start; background: var(--lav); }
    .panel { display: none; }
    .phone { border-radius: 0; box-shadow: none; height: var(--app-h, 844px); }
    #app .sb { display: none !important; }
    #app .pat-sb { top: 0 !important; }
    #app > div, #app [id^="screen-"] { height: var(--app-h, 844px) !important; }
  }
</style>
</head>
<body>
<div class="stage" id="stage"><div class="phone" id="phone"><div id="app"></div></div></div>

      <option value="onboard">31 취향 고르기 · 처음</option>

      <option value="shareSheet">51 리포트 공유하기</option>
      <option value="story">52 공유 카드 미리보기 · 9:16</option>

      <option value="recordHistory">54 기록 홈 · 여러 페스티벌 + 연도별</option>

      <option value="myMusic">58 MY › 연결된 음악 앱</option>
      <option value="mySettings">59 MY › 설정</option>
    </select>
  </div>
  <button type="button" id="restart">처음부터 다시 하기</button>
</aside>

<script src="vendor/preact.umd.js"></script>
<script src="js/dc-lite.js"></script>
<script src="js/festie-app.js"></script>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var start = params.get('start') || 'splash';
  var select = document.getElementById('start');
  if (select.querySelector('option[value="' + start + '"]')) select.value = start;

  dcLite.mount({
    template: document.getElementById('festie-screens'),
    component: window.FestieApp,
    target: document.getElementById('app'),
    props: { start: start }
  });

  function go(s) {
    var url = new URL(location.href);
    if (s === 'splash') url.searchParams.delete('start'); else url.searchParams.set('start', s);
    location.href = url.toString();
  }
  select.addEventListener('change', function () { go(select.value); });
  document.getElementById('restart').addEventListener('click', function () { go('splash'); });

  // 화면 크기에 맞춰 390×844 폰 화면을 줄여서 보여줘요
  var stage = document.getElementById('stage');
  var phone = document.getElementById('phone');
  var root = document.documentElement;
  var themeMeta = document.querySelector('meta[name="theme-color"]');
  function fit() {
    var narrow = window.innerWidth <= 760;
    if (narrow) {
      // 휴대폰: 폭에 맞춰 키우고, 남은 세로 길이만큼 앱 높이를 늘려요
      var s = window.innerWidth / 390;
      var top = parseFloat(getComputedStyle(document.body).paddingTop) || 0;
      var vh = (window.visualViewport ? window.visualViewport.height : window.innerHeight) - top;
      root.style.setProperty('--app-h', (vh / s) + 'px');
      phone.style.transform = 'scale(' + s + ')';
      stage.style.width = window.innerWidth + 'px';
      stage.style.height = vh + 'px';
    } else {
      var d = Math.max(0.4, Math.min(1, (window.innerHeight - 48) / 844, (window.innerWidth - 360) / 390));
      root.style.removeProperty('--app-h');
      phone.style.transform = 'scale(' + d + ')';
      stage.style.width = (390 * d) + 'px';
      stage.style.height = (844 * d) + 'px';
    }
  }
  // 휴대폰 상단(실제 상태바 뒤) 색을 지금 화면 배경색과 맞춰요
  var lastBg = '';
  function syncBg() {
    if (window.innerWidth > 760) { document.body.style.background = ''; return; }
    var el = document.querySelector('#app [id^="screen-"]');
    if (!el) return;
    var c = getComputedStyle(el).backgroundColor;
    if (c === lastBg) return;
    lastBg = c;
    document.body.style.background = c;
    if (themeMeta) themeMeta.setAttribute('content', c);
  }
  new MutationObserver(syncBg).observe(document.getElementById('app'), { childList: true, subtree: true });
  window.addEventListener('resize', function () { fit(); lastBg = ''; syncBg(); });
  if (window.visualViewport) window.visualViewport.addEventListener('resize', fit);
  fit();
  syncBg();
})();
</script>
