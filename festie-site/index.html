<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Festie</title>
<link rel="icon" href="../festie-prototype-v12/icons/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: one 16:9 illustrated desk scene (1600×900 units), letterboxed on the wall colour; labels and popups are HTML on top */
:root{
  --wall:#F3D9FF; --wall-tone:#E7C7F9; --spark-light:#E8A8FF; --lemon:#FFF7B8; --lemon-deep:#FBED90;
  --ink:#0A0A0A; --paper:#FFFDF7; --cream:#FFFDF4; --beige:#F1E9D2; --violet:#CC9CFC; --violet-ink:#9B76BF;
  --cork:#E3B97F; --wood:#C98E4F;
  --f-en:"Josefin Sans","Avenir Next","Segoe UI",sans-serif;
  --f-ko:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-hand:"Caveat","Noto Sans KR",cursive;
  --f-pixel:"Silkscreen","Courier New",monospace;
  color-scheme:light;
}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:var(--wall);color:var(--ink);font-family:var(--f-ko);overflow:hidden}
.stage{height:100%;display:flex;align-items:center;justify-content:center}
.scene{position:relative;width:min(100%,calc(100dvh * 16 / 9));aspect-ratio:16/9;max-width:100%;container-type:inline-size;user-select:none;-webkit-user-select:none}
.scene>svg{display:block;width:100%;height:100%}
@media (max-width:700px){
  body{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
}
svg text{stroke:none}
.hot{cursor:pointer}
.hot:focus{outline:none}
.hot:focus-visible .lift,.hot:focus-visible .wob{outline:3px solid var(--violet-ink);outline-offset:4px}
.lift,.wob{transform-box:fill-box;transition:transform .35s cubic-bezier(.34,1.4,.64,1)}
.lift{transform-origin:50% 100%}
.wob{transform-origin:50% 0%}
.hot:hover .lift,.hot.is-hover .lift{transform:translateY(-7px)}
.hot:hover .wob,.cork-group.is-hover .wob{animation:wob .6s ease-in-out}
@keyframes wob{0%,100%{transform:rotate(0)}30%{transform:rotate(-2.4deg)}70%{transform:rotate(1.8deg)}}
.blink{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.led{animation:led 2.4s ease-in-out infinite}
@keyframes led{50%{opacity:.35}}
.twinkle{animation:tw 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes tw{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1)}}
.steam{animation:steam 3s ease-in-out infinite;opacity:.0}
.steam.s2{animation-delay:1.1s}
@keyframes steam{0%{opacity:0;transform:translateY(8px)}40%{opacity:.8}100%{opacity:0;transform:translateY(-14px)}}
#notif{opacity:0;transform:translateY(-14px);transition:opacity .4s ease,transform .5s cubic-bezier(.34,1.4,.64,1)}
.has-push #notif{opacity:1;transform:none}
.has-push .phone-buzz{animation:buzz .5s ease-in-out 2}
@keyframes buzz{0%,100%{transform:rotate(0)}25%{transform:rotate(-2deg)}75%{transform:rotate(2deg)}}
#ring{opacity:0}
.has-push #ring{animation:ring 1.8s ease-out infinite}
@keyframes ring{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(1.18)}}
#ring{transform-box:fill-box;transform-origin:center}

/* labels on objects */
.tag{position:absolute;transform:translate(-50%,-100%);display:inline-flex;align-items:center;gap:.5em;padding:.62em 1.05em .58em .85em;border:0;border-radius:999px;background:var(--ink);color:var(--paper);font:700 clamp(11px,1.3cqw,21px)/1 var(--f-ko);cursor:pointer;white-space:nowrap;animation:bob 2.6s ease-in-out infinite;transition:background .2s,color .2s}
.tag::after{content:"";position:absolute;left:50%;bottom:-.48em;width:.9em;height:.9em;background:inherit;transform:translateX(-50%) rotate(45deg);border-radius:.12em;z-index:-1}
.tag span{font:700 .62em/1 var(--f-en);letter-spacing:.14em;color:var(--violet);padding-top:.18em}
.tag svg{width:1em;height:1em;flex:none;fill:var(--violet)}
.tag:nth-of-type(2){animation-delay:-.6s}.tag:nth-of-type(3){animation-delay:-1.2s}.tag:nth-of-type(4){animation-delay:-1.8s}
.tag:hover,.tag.is-hover,.tag:focus-visible{background:var(--violet);color:var(--ink);outline:none}
.tag:hover span,.tag.is-hover span,.tag:focus-visible span{color:var(--ink)}
.tag:hover svg,.tag.is-hover svg,.tag:focus-visible svg{fill:var(--ink)}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -5px}}
.hint{position:absolute;left:50%;top:96.6%;transform:translate(-50%,-50%);font:500 clamp(10px,.95cqw,16px)/1 var(--f-ko);display:flex;align-items:center;gap:.5em;white-space:nowrap;pointer-events:none}
.hint svg{width:1em;height:1em;animation:tw 1.6s ease-in-out infinite}
.hud{position:absolute;left:2.4%;top:3%;display:flex;align-items:flex-end;gap:.9cqw;pointer-events:none}
.hud svg{width:clamp(48px,5.6cqw,96px);height:auto;display:block}
.hud p{margin:0 0 .35em;font:700 clamp(7px,.68cqw,11px)/1 var(--f-en);letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}

/* popup window */
.modal{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:rgba(10,10,10,.42)}
.win{width:min(560px,100%);max-height:calc(100dvh - 32px);display:flex;flex-direction:column;background:var(--paper);border:2.5px solid var(--ink);border-radius:14px;box-shadow:8px 8px 0 var(--ink);overflow:hidden;animation:pop .32s cubic-bezier(.34,1.35,.64,1)}
.win.wide{width:min(720px,100%)}
@keyframes pop{from{transform:translateY(16px) scale(.96);opacity:0}to{transform:none;opacity:1}}
.bar{display:flex;align-items:center;gap:10px;padding:9px 10px 9px 16px;background:var(--ink);color:var(--violet)}
.bar .file{font:400 13px/1 var(--f-pixel);letter-spacing:.06em;flex:1}
.bar .sq{width:11px;height:11px;border-radius:2px;background:var(--wall)}
.bar .x{width:28px;height:28px;border-radius:6px;border:0;background:var(--violet);color:var(--ink);font:700 16px/1 var(--f-en);cursor:pointer;display:grid;place-items:center}
.bar .x:focus-visible{outline:3px solid var(--lemon);outline-offset:2px}
.body{padding:26px 28px 28px;overflow:auto;display:flex;flex-direction:column;gap:18px}
.eyebrow{align-self:flex-start;margin:0;padding:6px 10px 4px;border:2px solid var(--ink);border-radius:999px;font:700 12px/1 var(--f-en);letter-spacing:.16em}
.body h2{margin:0;font:800 clamp(24px,4.2vw,32px)/1.2 var(--f-ko);letter-spacing:-.03em;text-wrap:balance}
.lead{margin:-6px 0 0;font:400 16px/1.6 var(--f-ko);color:#3a3340}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tabs button{border:2px solid var(--ink);background:var(--paper);border-radius:999px;padding:8px 13px 7px;font:700 13.5px/1 var(--f-ko);cursor:pointer;color:var(--ink)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.tabs button:focus-visible{outline:3px solid var(--violet-ink);outline-offset:2px}
.panel{border:2px solid var(--ink);border-radius:12px;padding:16px 18px;background:var(--lemon);display:flex;flex-direction:column;gap:8px}
.panel .obj{margin:0;font:700 11px/1 var(--f-en);letter-spacing:.14em;color:#5e5640}
.panel .obj b{font-family:var(--f-ko);letter-spacing:0;font-size:12px}
.panel p.t{margin:0;font:400 15px/1.65 var(--f-ko)}
.extra{margin:0;padding:14px 16px;border-radius:12px;background:var(--lemon);font:400 14.5px/1.6 var(--f-ko)}
.extra b{display:block;font-weight:700;margin-bottom:2px}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.cta{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:999px;padding:13px 20px 12px;font:700 15px/1 var(--f-ko);cursor:pointer;text-decoration:none}
.cta:hover{background:var(--violet-ink);border-color:var(--violet-ink)}
.cta.ghost{background:var(--paper);color:var(--ink)}
.cta.ghost:hover{background:var(--wall)}
.cta:focus-visible{outline:3px solid var(--violet-ink);outline-offset:3px}
/* feature popup: line-drawn phone + text */
.feat{display:grid;grid-template-columns:auto minmax(0,1fr);gap:32px;align-items:start}
.feat-text{display:flex;flex-direction:column;gap:18px;min-width:0}
.pm-wrap{display:flex;flex-direction:column;align-items:center;gap:12px;position:sticky;top:0}
.pm{position:relative;width:min(218px,calc((100dvh - 170px) * .43));padding:9px;border:1.6px solid var(--ink);border-radius:38px;background:var(--paper)}
.pm::before,.pm::after{content:"";position:absolute;width:5px;border:1.4px solid var(--ink);background:var(--paper);border-radius:3px}
.pm::before{right:-6.5px;top:22%;height:13%;border-left:0;border-radius:0 3px 3px 0}
.pm::after{left:-6.5px;top:17%;height:20%;border-right:0;border-radius:3px 0 0 3px;box-shadow:0 0 0 0 transparent}
.pm-screen{position:relative;border:1.3px solid var(--ink);border-radius:27px;overflow:hidden;background:#F4D9FF}
.sb{display:flex;align-items:center;justify-content:space-between;padding:9px 16px 5px 20px;background:#F4D9FF;color:var(--ink);font:700 10.5px/1 var(--f-en);transition:background .25s,color .25s}
.sb-i{display:flex;align-items:center;gap:4px}
.sb-i svg{display:block}
.pm-img{position:relative;aspect-ratio:600/1298}
.pm-screen img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:opacity .25s ease}
.pm-screen img.out{opacity:0}
.pts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;border-top:1.5px solid var(--ink);padding-top:10px}
.pt{width:100%;display:grid;grid-template-columns:22px 1fr 16px;gap:10px;align-items:start;padding:12px 12px 12px 10px;border:1.5px solid transparent;border-radius:12px;background:transparent;text-align:left;cursor:pointer;color:var(--ink);font:inherit}
.pt:hover{background:#FAF0FF}
.pt[aria-selected="true"]{background:var(--wall);border-color:var(--ink)}
.pt:focus-visible{outline:3px solid var(--violet-ink);outline-offset:2px}
.pt svg{width:16px;height:16px;margin-top:3px;fill:var(--ink)}
.pt .arr{font:700 14px/1.4 var(--f-en);opacity:0;transition:opacity .2s}
.pt[aria-selected="true"] .arr{opacity:1}
.pt b{display:block;font:700 15px/1.4 var(--f-ko);margin-bottom:2px}
.pt span.d{display:block;font:400 14px/1.55 var(--f-ko);color:#3a3340}
.win.feature{width:min(820px,100%)}
@media (max-width:700px){
  .feat{grid-template-columns:1fr;gap:20px}
  .pm-wrap{position:static}
  .pm{width:min(170px,50vw)}
}
/* live prototype phone */
.live{display:grid;grid-template-columns:auto minmax(0,1fr);gap:48px;align-items:center}
.lp{--s:.8;box-sizing:border-box;width:calc(390px * var(--s) + 20px);padding:9px;border:1.6px solid var(--ink);border-radius:calc(64px * var(--s) + 9px);background:var(--paper);position:relative}
.lp::before,.lp::after{content:"";position:absolute;width:5px;border:1.4px solid var(--ink);background:var(--paper)}
.lp::before{right:-6.5px;top:22%;height:13%;border-left:0;border-radius:0 3px 3px 0}
.lp::after{left:-6.5px;top:17%;height:20%;border-right:0;border-radius:3px 0 0 3px}
.lp-screen{border:1.3px solid var(--ink);border-radius:calc(64px * var(--s));overflow:hidden;background:#0A0A0A}
.lp .sb{padding:calc(14px * var(--s)) calc(26px * var(--s)) calc(6px * var(--s)) calc(34px * var(--s));font-size:calc(15px * var(--s))}
.lp-view{position:relative;width:calc(390px * var(--s));height:calc(844px * var(--s));overflow:hidden}
.lp-view iframe{position:absolute;left:0;top:0;width:390px;height:844px;border:0;transform:scale(var(--s));transform-origin:0 0;background:#0A0A0A}
.live-text{display:flex;flex-direction:column;gap:18px;min-width:0}
.live-text .tip{margin:0;display:flex;gap:8px;align-items:center;font:500 14.5px/1.5 var(--f-ko);padding:10px 14px;border-radius:10px;background:var(--wall);align-self:flex-start}
.live-text .tip svg{width:14px;height:14px;fill:var(--ink);flex:none}
.qr img{width:100%;height:100%;display:block;image-rendering:pixelated}
.win.live-win{width:auto;max-width:100%}
@media (max-width:760px){.live{grid-template-columns:1fr;gap:24px}.lp{justify-self:center}}
/* try popup */
.try{display:grid;grid-template-columns:auto minmax(0,1fr);gap:44px;align-items:center}
.mock{box-sizing:border-box;width:218px;aspect-ratio:9/18.5;border:1.6px solid var(--ink);border-radius:38px;background:var(--paper);padding:9px}
.mock-screen{position:relative;height:100%;box-sizing:border-box;border:1.3px solid var(--ink);border-radius:27px;background:#120E16;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.mock-screen svg.logo{width:110px;fill:var(--violet);position:relative;z-index:1;margin-top:30px}
.mock-screen p{position:relative;z-index:1;margin:0;color:#e9dcf2;font:400 11px/1.4 var(--f-ko);text-align:center}
.mock-screen .go{position:absolute;bottom:22px;left:16px;right:16px;padding:11px 0 10px;border-radius:999px;background:var(--violet);color:var(--ink);font:700 12px/1 var(--f-ko);text-align:center}
.conf{position:absolute;inset:0}
.conf i{position:absolute;width:9px;height:9px;background:var(--violet);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:fall 5s linear infinite}
.conf i:nth-child(3n){background:var(--lemon);width:6px;height:6px}
.conf i:nth-child(4n){border-radius:50%;clip-path:none;width:4px;height:4px;background:#fff}
@keyframes fall{from{transform:translateY(-30px) rotate(0)}to{transform:translateY(420px) rotate(220deg)}}
.from{align-self:flex-start;margin:0;padding:8px 12px;border-radius:10px;background:var(--wall);font:500 13.5px/1.4 var(--f-ko)}
.qrrow{display:flex;gap:14px;align-items:center}
.qr{width:96px;height:96px;padding:6px;border:2px solid var(--ink);border-radius:10px;background:#fff;flex:none}
.qr img,.qr canvas{width:100%!important;height:100%!important;display:block;image-rendering:pixelated}
.qrrow p{margin:0;font:400 14px/1.55 var(--f-ko);color:#3a3340}
.qrrow code{display:block;margin-top:4px;font:400 11px/1.4 var(--f-pixel);color:#6b6075;word-break:break-all}
@media (max-width:620px){
  .try{grid-template-columns:1fr;gap:28px}
  .mock{width:170px;justify-self:center}
  .body{padding:22px 20px 22px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .steam{opacity:.6}
}
</style>
</head>

  prepare:{file:'prepare.exe',eyebrow:'PREPARE',title:'담는 순간, 준비 시작.',lead:'페스티벌 하나에 준비할 것 네 가지.<br>다 채우면 공연 날은 가볍게.',
    tabs:{
      timetable:{name:'타임테이블',obj:'포스터 + 타임테이블',lines:['1일차, 2일차 볼 무대만 골라 나만의 동선으로.','겹치는 시간은 미리 체크.','친구와는 링크 하나로 주고받기.'],start:'tte',startLabel:'타임테이블',shot:'tt',shotLabel:'2-17 내 타임테이블'},
      playlist:{name:'플레이리스트',obj:'CD',lines:['내 타임테이블 아티스트로 만든 예습 플레이리스트.','빼고 싶은 곡은 빼고, 음악 앱으로 바로.'],start:'playlist',startLabel:'플레이리스트',shot:'playlist',shotLabel:'2-22 예습 플레이리스트'},
      check:{name:'체크리스트',obj:'클립보드 체크리스트',lines:['페스티벌 필수템 13가지에 내 짐까지 더해서.','못 챙긴 건 당일 아침에 한 번 더.'],start:'check',startLabel:'체크리스트',shot:'check',shotLabel:'2-18 체크리스트'},
      ticket:{name:'티켓',obj:'티켓',lines:['예매처 캡처 한 장이면 입장 QR 저장 끝.','당일엔 ‘티켓 꺼내기’만.'],start:'ticket',startLabel:'티켓 등록',shot:'ticketSaved',shotLabel:'2-29 티켓 등록'},
      today:{name:'공연 당일',obj:'달력 · D-day 메모',lines:['준비를 마치면 도착하는 D-DAY 알림.','지금 공연, 다음 무대, 티켓 QR이 한 화면에.'],start:'today',startLabel:'공연 당일 모드',shot:'today',shotLabel:'2-31 공연 당일 모드'}
    }},
  record:{file:'record.exe',eyebrow:'RECORD',title:'그날의 페스티벌, 리포트 한 장으로.',lead:'공연이 끝나면 열리는 기록.<br>세 단계면 충분해요.',
    points:[['사진','그날 앨범에서 골라 담기. 첫 장이 대표 사진','reportFilled','3-06 사진 담기'],['별점 + 한 줄 소감','그날의 기분을 60자로','reportStep2','3-08 별점 + 한 줄 소감'],['실제로 본 무대','못 본 무대는 빼고, 즉흥으로 본 무대는 더하고','reportStep3','3-09 실제로 본 무대'],['쌓인 리포트로 보는 나','다녀온 도시, 본 아티스트, 많이 간 장르까지. 공유는 9:16 카드로','recordSaved','3-14 기록 홈']]}
};

const modal=document.getElementById('modal'),win=document.getElementById('win'),body=document.getElementById('winBody'),file=document.getElementById('winFile');
let lastFocus=null,current=null,prepareSeen=false,pushed=false;

const SHOTS=['discover','artist','detailUnreleased','tt','playlist','check','ticketSaved','today','reportFilled','reportStep2','reportStep3','recordSaved'];
let preloaded=false;
function preload(){if(preloaded)return;preloaded=true;SHOTS.forEach(k=>{const i=new Image();i.src=`shots/${k}.webp`})}
const SB_ICONS='<svg width="15" height="9" viewBox="0 0 15 9" fill="currentColor"><rect x="0" y="6" width="2.6" height="3" rx=".6"/><rect x="4" y="4.2" width="2.6" height="4.8" rx=".6"/><rect x="8" y="2.2" width="2.6" height="6.8" rx=".6"/><rect x="12" y="0" width="2.6" height="9" rx=".6"/></svg><svg width="13" height="9" viewBox="0 0 13 9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M1 3.2a8 8 0 0 1 11 0M3 5.4a5 5 0 0 1 7 0"/><circle cx="6.5" cy="7.7" r=".9" fill="currentColor" stroke="none"/></svg><svg width="22" height="10" viewBox="0 0 22 10" fill="none"><rect x=".6" y=".6" width="18.4" height="8.8" rx="2.4" stroke="currentColor" stroke-width="1.1" opacity=".55"/><rect x="2.2" y="2.2" width="13" height="5.6" rx="1.2" fill="currentColor"/><path d="M20.4 3.4v3.2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" opacity=".55"/></svg>';
const SB_BG={artist:'#0A1015',detailUnreleased:'#1C1D18',today:'#050505',reportFilled:'#FFF7B8',reportStep2:'#FFF7B8',reportStep3:'#FFF7B8',recordSaved:'#FFF7B8'};
function phoneHTML(){return `<div class="pm-wrap"><div class="pm"><div class="pm-screen"><div class="sb" id="sb"><span>9:41</span><span class="sb-i">${SB_ICONS}</span></div><div class="pm-img"><img id="shot" alt="" src=""></div></div></div></div>`}
function showShot(key,label){
  const img=document.getElementById('shot'),sb=document.getElementById('sb');if(!img)return;
  const src=`shots/${key}.webp`,bg=SB_BG[key]||'#F4D9FF',dark=/^#0|^#1/.test(bg);
  sb.style.background=bg;sb.style.color=dark?'#FFFFFF':'#0A0A0A';
  img.alt=`Festie 앱 화면: ${label}`;
  if(img.getAttribute('src')===src)return;
  if(!img.getAttribute('src')){img.src=src;return}
  img.classList.add('out');setTimeout(()=>{img.src=src;img.onload=()=>img.classList.remove('out');setTimeout(()=>img.classList.remove('out'),300)},150);
}
function render(key,opt={}){
  current=key;preload();
  win.classList.remove('live-win');win.classList.toggle('wide',key==='try');win.classList.toggle('feature',key!=='try');
  if(key==='try'){renderTry(opt);return}
  const d=D[key];file.textContent=d.file;
  const tint=key==='record'?'#FFF7B8':key==='prepare'?'#E8A8FF':'#F3D9FF';
  let h=`<div class="feat">${phoneHTML()}<div class="feat-text"><p class="eyebrow" style="background:${tint}">${d.eyebrow}</p><h2 id="winTitle">${d.title}</h2><p class="lead">${d.lead}</p>`;
  if(key==='prepare'){
    const tab=opt.tab||'timetable';
    h+='<div class="tabs" role="tablist">'+Object.entries(d.tabs).map(([k,t])=>`<button type="button" role="tab" data-tab="${k}" aria-selected="${k===tab}">${t.name}</button>`).join('')+'</div><div class="panel" id="panel" role="tabpanel"></div></div></div>';
    body.innerHTML=h;setTab(tab);
    body.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));
    prepareSeen=true;
  }else{
    h+='<ul class="pts" role="tablist">'+d.points.map(([b,txt,shot,lab],i)=>`<li><button type="button" class="pt" role="tab" data-i="${i}" aria-selected="${i===0}">${SPARK}<span><b>${b}</b><span class="d">${txt}</span></span><span class="arr">→</span></button></li>`).join('')+'</ul></div></div>';
    body.innerHTML=h;
    const pick=i=>{body.querySelectorAll('.pt').forEach(b=>b.setAttribute('aria-selected',b.dataset.i==i));const p=d.points[i];showShot(p[2],p[3])};
    body.querySelectorAll('.pt').forEach(b=>{b.addEventListener('click',()=>pick(+b.dataset.i));b.addEventListener('mouseenter',()=>pick(+b.dataset.i))});
    pick(0);
  }
  body.scrollTop=0;
}
function setTab(k){
  const t=D.prepare.tabs[k];
  body.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===k));
  document.getElementById('panel').innerHTML=`<p class="obj">ON THE BOARD · <b>${t.obj}</b></p><p class="t">${t.lines.join('<br>')}</p>`;
  showShot(t.shot,t.shotLabel);
}
function liveScale(){
  const avail=Math.min(window.innerHeight-170,(window.innerWidth<760?window.innerWidth-80:window.innerWidth*.55));
  return Math.max(.45,Math.min(.95,(window.innerWidth<760?avail/390:avail/(844+30))));
}
let bgTimer=null;
function syncBar(){
  const f=document.getElementById('proto'),sb=document.getElementById('sbLive');if(!f||!sb)return;
  try{
    const doc=f.contentDocument;if(!doc)return;
    let n=doc.elementFromPoint(195,4),bg='';
    while(n&&n!==doc.documentElement){const c=getComputedStyle(n).backgroundColor;if(c&&c!=='transparent'&&!/rgba\(.*,\s*0\)$/.test(c)){bg=c;break}n=n.parentElement}
    if(!bg)return;
    const m=bg.match(/\d+/g).map(Number),lum=(m[0]*299+m[1]*587+m[2]*114)/1000;
    sb.style.background=bg;sb.style.color=lum<128?'#FFFFFF':'#0A0A0A';
  }catch(e){}
}
window.hookProto=function(f){try{const w=f.contentWindow;w.document;['pointerdown','touchstart','keydown','wheel'].forEach(ev=>w.addEventListener(ev,poke,{passive:true}));f.dataset.same='1'}catch(e){f.dataset.same='0'}};
function renderTry(opt){
  file.textContent='try-festie.exe';win.classList.remove('wide','feature');win.classList.add('live-win');
  const src=opt.start?`${PROTO}?start=${opt.start}`:PROTO;
  body.innerHTML=`<div class="live">
    <div class="lp" id="lp"><div class="lp-screen"><div class="sb" id="sbLive" style="background:#0A0A0A;color:#FFFFFF"><span>9:41</span><span class="sb-i">${SB_ICONS}</span></div>
      <div class="lp-view"><iframe id="proto" title="Festie 프로토타입" src="${src}" onload="hookProto(this)"></iframe></div></div></div>
    <div class="live-text">
      <p class="eyebrow" style="background:#CC9CFC">TRY FESTIE</p>
      <h2 id="winTitle">이제 직접.</h2>
      <p class="lead">시작부터 탐색, 준비, 기록까지 실제 앱 그대로.</p>
      <p class="tip">${SPARK}왼쪽 화면을 직접 눌러보세요</p>
      <div class="actions"><button class="cta ghost" type="button" id="restart">처음부터 다시</button></div>
      <div class="qrrow"><div class="qr"><img src="qr.png" alt="프로토타입 QR 코드"></div><p>QR을 찍으면 내 폰에서 이어서<code>${BASE.replace('https://','')}</code></p></div>
    </div></div>`;
  const lp=document.getElementById('lp');lp.style.setProperty('--s',liveScale().toFixed(3));
  document.getElementById('restart').onclick=()=>{document.getElementById('proto').src=PROTO};
  clearInterval(bgTimer);bgTimer=setInterval(syncBar,400);
  body.scrollTop=0;
}
window.addEventListener('resize',()=>{const lp=document.getElementById('lp');lp&&lp.style.setProperty('--s',liveScale().toFixed(3))});
function open(key,opt){
  lastFocus=document.activeElement;render(key,opt);modal.hidden=false;
  setTimeout(()=>document.getElementById('winClose').focus(),30);
}
function close(){
  modal.hidden=true;clearInterval(bgTimer);body.innerHTML='';
  if(prepareSeen&&!pushed){pushed=true;setTimeout(()=>{document.getElementById('scene').classList.add('has-push');document.querySelector('#hint span').textContent='핸드폰에 알림이 왔어요 · 눌러보세요'},700)}
  lastFocus&&lastFocus.focus&&lastFocus.focus();
}
document.getElementById('winClose').addEventListener('click',close);
/* exhibition: back to the empty desk after a quiet spell */
let idleT=null;
function resetAll(){
  if(!modal.hidden){modal.hidden=true;clearInterval(bgTimer);body.innerHTML=''}
  prepareSeen=false;pushed=false;document.getElementById('scene').classList.remove('has-push');
  document.querySelector('#hint span').textContent='책상 위 물건을 눌러보세요';
}
function poke(){clearTimeout(idleT);idleT=setTimeout(resetAll,IDLE_MS)}
['pointerdown','pointermove','keydown','wheel','touchstart'].forEach(ev=>window.addEventListener(ev,poke,{passive:true}));
setInterval(()=>{const f=document.getElementById('proto');if(f&&f.dataset.same!=='1'&&document.activeElement===f)poke()},5000);
poke();
modal.addEventListener('click',e=>{if(e.target===modal)close()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!modal.hidden)close()});

/* hotspots + linked hover between objects and tags */
const scene=document.getElementById('scene');
function tagHover(key,on){scene.querySelectorAll(`.tag[data-open="${key}"]`).forEach(t=>t.classList.toggle('is-hover',on))}
function linkHover(key,on){
  scene.querySelectorAll(`.tag[data-open="${key}"]`).forEach(t=>t.classList.toggle('is-hover',on));
  if(key==='prepare')document.getElementById('obj-prepare').classList.toggle('is-hover',on);
  else{const o=document.getElementById('obj-'+key);o&&o.classList.toggle('is-hover',on)}
}
scene.querySelectorAll('.hot,.tag').forEach(n=>{
  const key=n.dataset.open;
  n.addEventListener('click',()=>open(key,{tab:n.dataset.tab}));
  n.addEventListener('keydown',e=>{if(n.tagName!=='BUTTON'&&(e.key==='Enter'||e.key===' ')){e.preventDefault();open(key,{tab:n.dataset.tab})}});
  const whole=n.classList.contains('tag')||key!=='prepare';
  n.addEventListener('mouseenter',()=>whole?linkHover(key,true):tagHover(key,true));
  n.addEventListener('mouseleave',()=>whole?linkHover(key,false):tagHover(key,false));
});
})();
</script>
